<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Quanten-Imperium – Cyberpunk Incremental Clicker">
<title>Quanten-Imperium</title>
<style>
:root{
 --bg:#0B0F19;--txt:#e6f1ff;--mut:#7d8ba3;
 --cyan:#00F3FF;--mag:#FF007F;--em:#00FF66;--gold:#FFC23D;
 --accent:#00F3FF;--accent2:#FF007F;--acc-rgb:0,243,255;
 --glass:rgba(16,24,44,.58);--brd:rgba(var(--acc-rgb),.24);
 --r:16px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
 --c0:#9aa6b8;--c1:#3d9bff;--c2:#b45bff;--c3:#ff9d1c;--c4:#ff2d95;
}
body[data-theme="magenta"]{--accent:#FF007F;--accent2:#00F3FF;--acc-rgb:255,0,127}
body[data-theme="emerald"]{--accent:#00FF66;--accent2:#00F3FF;--acc-rgb:0,255,102}
body[data-theme="gold"]{--accent:#FFC23D;--accent2:#FF007F;--acc-rgb:255,194,61}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% -10%,rgba(var(--acc-rgb),.16),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(255,0,127,.08),transparent 50%),repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
button{font-family:inherit;cursor:pointer}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;height:100dvh;max-width:640px;margin:0 auto}
header{padding:calc(8px + var(--st)) 14px 8px;background:linear-gradient(180deg,rgba(11,15,25,.96),rgba(11,15,25,.78));border-bottom:1px solid var(--brd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hrow{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;letter-spacing:.18em;font-size:12px;color:var(--accent);text-shadow:0 0 8px var(--accent)}
.logo span{color:var(--accent2)}
.ibtn{position:relative;background:var(--glass);border:1px solid var(--brd);color:var(--txt);border-radius:10px;width:38px;height:32px;font-size:16px}
.dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--mag);box-shadow:0 0 8px var(--mag);display:none}
.dot.on{display:block}
.energy{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;text-shadow:0 0 14px rgba(var(--acc-rgb),.6)}
.energy small{font-size:12px;color:var(--mut);margin-left:6px;font-weight:600}
.dps{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.soft{color:var(--gold);font-size:11px;margin-left:6px}
.curs{display:flex;gap:6px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
.curs::-webkit-scrollbar{display:none}
.cur{flex:none;font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);white-space:nowrap;font-variant-numeric:tabular-nums}
.cur b{color:var(--accent)}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 12px 24px;overscroll-behavior:contain;will-change:transform}
.tab{display:none}
.tab.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav{display:flex;padding:6px 4px calc(6px + var(--sb));background:rgba(8,11,20,.94);border-top:1px solid var(--brd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:9px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
nav button i{font-style:normal;font-size:19px;line-height:1.1}
nav button.on{color:var(--accent);background:rgba(var(--acc-rgb),.09)}
nav button.on i{text-shadow:0 0 10px var(--accent)}
.card{background:var(--glass);border:1px solid var(--brd);border-radius:var(--r);padding:12px;margin-bottom:10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 6px 24px rgba(0,0,0,.35)}
body.lowfx .card,body.lowfx header,body.lowfx nav{backdrop-filter:none;-webkit-backdrop-filter:none}
h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h3 small{color:var(--mut);text-transform:none;letter-spacing:0;font-weight:400;margin-left:4px}
p{margin:4px 0}
.mut{color:var(--mut);font-size:12px}
.mt{margin-top:8px}
.hidden{display:none!important}
.btn{appearance:none;-webkit-appearance:none;border:1px solid rgba(var(--acc-rgb),.5);background:linear-gradient(180deg,rgba(var(--acc-rgb),.2),rgba(var(--acc-rgb),.06));color:var(--txt);padding:9px 12px;border-radius:12px;font-weight:700;font-size:13px;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.off{opacity:.38;filter:grayscale(.5)}
.btn.on{background:rgba(var(--acc-rgb),.38);border-color:var(--accent)}
.btn.mag{border-color:rgba(255,0,127,.6);background:linear-gradient(180deg,rgba(255,0,127,.24),rgba(255,0,127,.06))}
.btn.full{width:100%}
.btn.sm{padding:6px 9px;font-size:12px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns .btn{flex:1}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .2s linear}
.bar.thin{height:4px}
.bar.heat i{background:linear-gradient(90deg,#ffb000,#ff3b3b)}
.bar.od i{background:linear-gradient(90deg,var(--accent2),#fff)}
.big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.acc-t{color:var(--accent)}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:linear-gradient(90deg,rgba(var(--acc-rgb),.2),rgba(255,0,127,.12));border:1px solid var(--brd);font-size:12px}
.banner.neg{background:linear-gradient(90deg,rgba(255,59,59,.24),rgba(255,140,0,.1));border-color:rgba(255,59,59,.45)}
.banner .ei{font-size:22px}
.banner b{display:block;font-size:13px}
.banner .bt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--txt);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:22px}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--brd);background:rgba(var(--acc-rgb),.1);font-variant-numeric:tabular-nums}
.chip.hot{border-color:#ff3b3b;background:rgba(255,59,59,.15)}
/* ---------- Quantenkern ---------- */
.core-wrap{position:relative;width:min(70vw,290px);aspect-ratio:1/1;margin:6px auto 12px;touch-action:none;-webkit-user-select:none;user-select:none}
.ring{position:absolute;border-radius:50%;pointer-events:none;will-change:transform}
.r1{inset:3%;border:1px dashed rgba(var(--acc-rgb),.35);animation:spin 26s linear infinite}
.r2{inset:11%;border:2px solid transparent;border-top-color:var(--accent2);border-bottom-color:var(--accent);animation:spin 6s linear infinite reverse;opacity:.75}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit{position:absolute;inset:0;animation:spin 14s linear infinite;pointer-events:none;will-change:transform}
.dslot{position:absolute;inset:0}
.drone{position:absolute;left:50%;top:-1px;width:14px;height:14px;margin-left:-7px;border-radius:4px;background:var(--accent2);box-shadow:0 0 10px var(--accent2);transform:rotate(45deg);transition:background .1s}
.orbit.fire .drone{background:#fff;box-shadow:0 0 18px #fff}
.shock{position:absolute;inset:20%;border-radius:50%;border:3px solid var(--accent2);opacity:0;pointer-events:none;will-change:transform,opacity}
#shock2{border-color:var(--accent);border-width:2px}
.core-scale{position:absolute;inset:20%;will-change:transform}
.core{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--accent) 16%,rgba(var(--acc-rgb),.35) 45%,#05070d 74%);box-shadow:0 0 40px rgba(var(--acc-rgb),.7),inset 0 0 30px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;overflow:visible}
.core::after{content:"";position:absolute;inset:-16%;border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.45),transparent 66%);animation:glow 2.2s ease-in-out infinite;will-change:opacity,transform;z-index:-1}
@keyframes glow{50%{opacity:.35;transform:scale(1.14)}}
.core-in{position:absolute;inset:12%;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.35),transparent 30%,rgba(var(--acc-rgb),.45),transparent 60%,rgba(255,0,127,.3),transparent 85%);animation:spin 4s linear infinite;mix-blend-mode:screen;will-change:transform}
.core-txt{position:relative;font-weight:900;font-size:13px;letter-spacing:.12em;color:#fff;text-shadow:0 0 8px #000}
body.shut .core{filter:grayscale(1) brightness(.45)}
body.shut .core-txt{color:#ff4d4d}
body[data-aura="aurora"] .core{background:radial-gradient(circle at 35% 30%,#fff 0,#00ff99 16%,#7a00ff 50%,#05070d 76%)}
body[data-aura="supernova"] .core{background:radial-gradient(circle at 35% 30%,#fff 0,#ffd000 14%,#ff3d00 48%,#120200 76%)}
body[data-aura="void"] .core{background:radial-gradient(circle at 50% 50%,#000 0,#000 32%,#6a00ff 54%,#000 78%)}
body[data-aura="glitch"] .core{animation:glitch .4s steps(2) infinite}
@keyframes glitch{50%{filter:hue-rotate(150deg) saturate(2)}}
body[data-aura="plasma"] .core{background:radial-gradient(circle at 35% 30%,#fff 0,#ff00e5 15%,#00f3ff 45%,#05070d 76%)}
#hyperFx{position:fixed;inset:-20%;pointer-events:none;z-index:2;opacity:0;background:conic-gradient(from 0deg,rgba(255,0,127,.16),rgba(0,243,255,.16),rgba(0,255,102,.12),rgba(255,0,127,.16));transition:opacity .4s;will-change:transform,opacity}
body.hyper #hyperFx{opacity:1;animation:spin 3s linear infinite}
body.hyper .core-in{animation-duration:.6s}
body.hyper .orbit{animation-duration:2.5s}
body.lowfx #hyperFx{display:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:65;will-change:opacity}
.meters .meter{margin-bottom:8px}
.meter label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:4px}
.meter label b{color:var(--txt);font-variant-numeric:tabular-nums}
.hyper-btn{width:100%;margin-top:4px;letter-spacing:.08em}
.hyper-btn.ready{animation:readyGlow 1s ease-in-out infinite alternate;border-color:var(--accent2)}
@keyframes readyGlow{to{box-shadow:0 0 22px rgba(255,0,127,.6)}}
.hint{font-size:11px;color:var(--mut);text-align:center;margin-top:8px}
.boss-card.alert{border-color:rgba(255,59,59,.6);box-shadow:0 0 20px rgba(255,59,59,.25)}
canvas#graph{width:100%;height:140px;display:block}
/* ---------- FX ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:75;overflow:hidden}
.fnum{position:absolute;left:0;top:0;font-weight:800;font-size:18px;color:#fff;text-shadow:0 0 8px var(--accent),0 2px 2px #000;white-space:nowrap;will-change:transform,opacity;opacity:0}
.fnum.crit{font-size:26px;color:var(--accent2);text-shadow:0 0 12px var(--accent2),0 2px 2px #000}
.fnum.drone{font-size:12px;color:var(--em);text-shadow:0 0 6px var(--em)}
.fnum.boss{color:#ff5a5a}
.fnum.warn{color:#ff5a5a;font-size:14px}
.pt{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);will-change:transform,opacity;opacity:0}
/* ---------- Toasts ---------- */
#toasts{position:fixed;top:calc(10px + var(--st));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:rgba(10,14,26,.95);border:1px solid var(--brd);border-left:3px solid var(--accent);border-radius:12px;padding:9px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .3s ease}
.toast.out{animation:tout .3s ease forwards}
.toast.ach{border-left-color:var(--gold)}
.toast.drop{border-left-color:var(--c3)}
.toast.warn{border-left-color:#ff3b3b}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}
@keyframes tout{to{opacity:0;transform:translateY(-12px)}}
/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + var(--sb));transition:opacity .2s;opacity:1}
.modal.hidden{opacity:0;pointer-events:none;visibility:hidden}
.mbox{width:100%;max-width:480px;max-height:85vh;overflow-y:auto;background:rgba(14,20,36,.97);border:1px solid var(--brd);border-radius:20px;padding:16px;box-shadow:0 0 40px rgba(var(--acc-rgb),.18);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.modal.hidden .mbox{transform:translateY(40px)}
.mtext{font-size:13px;line-height:1.5}
/* ---------- Boss ---------- */
#bossOv{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 45%,rgba(110,0,30,.96),rgba(6,4,10,.99) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;touch-action:none;gap:6px}
#bossOv .bar{width:min(86vw,380px);height:12px}
.boss-hp i{background:linear-gradient(90deg,#ff004c,#ff9d1c)!important}
.boss-time i{background:linear-gradient(90deg,#fff,var(--accent))!important;transition:none}
.boss-name{font-size:20px;font-weight:900;color:#ff4d6d;text-shadow:0 0 14px #ff004c;letter-spacing:.06em;text-align:center}
.boss-lvl{font-size:12px;color:var(--mut);text-align:center}
#bossTap{position:relative;width:min(56vw,230px);aspect-ratio:1;margin:34px 0 30px;touch-action:none}
.boss-shield{position:absolute;inset:-6%;border-radius:50%;border:3px dashed rgba(255,77,109,.7);animation:spin 5s linear infinite}
#bossSprite{position:absolute;inset:0;will-change:transform}
.boss-body{position:absolute;inset:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:conic-gradient(from 0deg,#ff004c,#3a0014,#ff004c,#14000a,#ff004c);animation:spin 3s linear infinite}
.boss-eye{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe600 20%,#ff004c 55%,#000 75%);box-shadow:0 0 30px #ff004c;animation:glow 1s ease-in-out infinite}
/* ---------- Segmente / Listen ---------- */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:max-content;padding:8px 10px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:700;font-size:12px}
.seg button.on{background:rgba(var(--acc-rgb),.16);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.35)}
.sub{display:none}
.sub.on{display:block}
.buyrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px}
.tog{display:flex;align-items:center;gap:8px;font-size:12px;margin-left:auto}
.sw{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.14);transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.bcard,.item{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;margin-bottom:8px;background:var(--glass);border:1px solid rgba(255,255,255,.07)}
.bcard.can,.item.can{border-color:var(--brd);box-shadow:0 0 14px rgba(var(--acc-rgb),.1)}
.bico{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(var(--acc-rgb),.08);border:1px solid var(--brd);color:var(--accent)}
.binfo{flex:1;min-width:0}
.bname{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.bname span{color:var(--accent);font-variant-numeric:tabular-nums}
.bsub{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.bms{display:flex;align-items:center;gap:6px;margin-top:4px}
.bms .bar{flex:1}
.bms small{font-size:10px;color:var(--mut);white-space:nowrap}
.bsyn{font-size:10px;color:var(--em);min-height:12px}
.bbuy{flex:none;min-width:86px;display:flex;flex-direction:column;align-items:center;padding:7px 8px}
.bbuy span{font-size:10px;color:var(--mut);font-weight:600}
.bbuy b{font-size:12px;font-variant-numeric:tabular-nums}
.locked{opacity:.45;filter:grayscale(1)}
.item .t{font-weight:700;font-size:13px}
.item .d{font-size:11px;color:var(--mut)}
.item.done{opacity:.55}
.acc{border-radius:14px;margin-bottom:8px;border:1px solid var(--brd);background:var(--glass);overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:10px;padding:12px;background:none;border:0;color:var(--txt);font-weight:700;font-size:14px;text-align:left}
.acc-h .ar{margin-left:auto;transition:transform .25s;color:var(--accent)}
.acc-h small{color:var(--mut);font-weight:400;font-size:11px}
.acc.open .acc-h .ar{transform:rotate(90deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden}
.acc-in{padding:0 10px 10px 18px;border-left:2px solid rgba(var(--acc-rgb),.18);margin-left:14px}
.rnode{padding:10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-top:8px;position:relative}
.rnode::before{content:"";position:absolute;left:-20px;top:20px;width:18px;height:2px;background:rgba(var(--acc-rgb),.35)}
.rhead{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.rhead span{color:var(--accent);font-variant-numeric:tabular-nums}
.rdesc{font-size:11px;color:var(--mut);margin:4px 0 6px}
.rnode.max{border-color:rgba(0,255,102,.4)}
.rnode.lock{opacity:.45}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.slot{padding:10px;border-radius:14px;background:var(--glass);border:1px dashed rgba(255,255,255,.18);min-height:92px}
.slot.r0,.slot.r1,.slot.r2,.slot.r3,.slot.r4{border-style:solid;color:var(--txt)}
.slot .sl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.slot .sn{font-weight:700;font-size:12px;margin:3px 0}
.slot .ss{font-size:10px;color:var(--mut);line-height:1.4}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.tile{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.03);border:2px solid;position:relative;font-size:22px;padding:0}
.tile small{font-size:9px;color:var(--mut);position:absolute;bottom:3px}
.tile .eqm{position:absolute;top:2px;right:4px;font-size:10px;color:var(--em)}
.tile .lk{position:absolute;top:2px;left:4px;font-size:9px}
.r0{border-color:var(--c0);color:var(--c0)}.r1{border-color:var(--c1);color:var(--c1)}.r2{border-color:var(--c2);color:var(--c2)}.r3{border-color:var(--c3);color:var(--c3)}
.r4{border-color:var(--c4);color:var(--c4);box-shadow:0 0 14px rgba(255,45,149,.35)}

 hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return(h>>>0).toString(16).padStart(8,'0');},
 xor(b){const k=new TextEncoder().encode(this.XK);for(let i=0;i<b.length;i++)b[i]^=k[i%k.length]^((i*31)&255);return b;},
 toB64(b){let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);},

  if(p.length!==3||p[0]!=='QI1')throw new Error('Ungültiges Format');
  const json=new TextDecoder().decode(this.xor(this.fromB64(p[2])));
  if(this.hash(json)!==p[1])throw new Error('Prüfsumme ungültig – Code beschädigt');
  const o=JSON.parse(json);if(!o||!Array.isArray(o.b))throw new Error('Beschädigte Spieldaten');return o;
 }
};

 },

/* ============================ PRESTIGE SYSTEM ============================ */
const Prestige={
 dmPending(){const r=GS.S.runEnergy;if(r<1e9)return 0;return Math.floor(Math.sqrt(r/1e9)*Engine.B.dmGain);},
 dmNeed(k){const g=this.dmPending();return 1e9*Math.pow((g+k)/Engine.B.dmGain,2);},
 atPending(){const r=GS.S.dmRunEarned;if(r<1000)return 0;return Math.floor(Math.sqrt(r/1000)*Engine.B.atGain);},
 atNeed(k){const g=this.atPending();return 1000*Math.pow((g+k)/Engine.B.atGain,2);},
 qkPending(){const r=GS.S.atRunEarned;if(r<50)return 0;return Math.floor(Math.sqrt(r/50)*Engine.B.qkGain);},
 qkNeed(k){const g=this.qkPending();return 50*Math.pow((g+k)/Engine.B.qkGain,2);},
 resetRun(keepUpg,keepDrones){const S=GS.S;S.energy=0;S.runEnergy=0;S.b=Array(15).fill(0);if(!keepUpg)S.upg={};if(!keepDrones)S.drones=0;S.combo=1;S.odMeter=0;S.odUntil=0;S.heat=0;S.shutUntil=0;S.hackUntil=0;if(S.skills.autogod)for(let i=0;i<5;i++)S.b[i]=25;},
 l1(silent){const g=this.dmPending();if(g<1){UI.deny();Toast.show(`Benötigt mindestens ${Fmt.n(1e9/Math.pow(Engine.B.dmGain,2))} Lauf-Energie`,'warn');return;}
  const go=()=>{const S=GS.S,gg=this.dmPending();if(gg<1)return;S.dm+=gg;S.dmLife+=gg;S.dmRunEarned+=gg;S.resets.l1++;this.resetRun(S.atLife>=3,S.atLife>=10);this.after(`Quanten-Reset: +${Fmt.n(gg)} Dunkle Materie`,silent);};
  if(silent)go();else Modal.confirm('◆ Quanten-Reset',`Du erhältst <b>+${Fmt.n(g)} Dunkle Materie</b> (jede DM: +5% Produktion).<br><br>Zurückgesetzt werden: Energie, Generatoren${GS.S.atLife>=3?'':', Verbesserungen'}${GS.S.atLife>=10?'':', Drohnen'}.`,go,{yesTxt:'Reset durchführen',danger:true});},
 l2(){const g=this.atPending();if(g<1){UI.deny();Toast.show('Benötigt 1.000 im Zyklus verdiente Dunkle Materie','warn');return;}
  Modal.confirm('✧ Dimensions-Kollaps',`Du erhältst <b>+${Fmt.n(g)} Anti-Teilchen</b>.<br><br>Zurückgesetzt werden: Energie, Generatoren, Verbesserungen, Drohnen <b>und Dunkle Materie</b>. Forschung, Relikte, Artefakte und Erfolge bleiben.`,()=>{
   const S=GS.S,gg=this.atPending();if(gg<1)return;S.at+=gg;S.atLife+=gg;S.atRunEarned+=gg;S.resets.l2++;S.dm=0;S.dmRunEarned=0;this.resetRun(false,false);this.after(`Dimensions-Kollaps: +${Fmt.n(gg)} Anti-Teilchen`);},{yesTxt:'Kollaps einleiten',danger:true});},
 l3(){const g=this.qkPending();if(g<1){UI.deny();Toast.show('Benötigt 50 im Zyklus verdiente Anti-Teilchen','warn');return;}
  Modal.confirm('⬢ Singularitäts-Transzendenz',`Du erhältst <b>+${Fmt.n(g)} Quanten-Kerne</b> für den Skillbaum.<br><br>Zurückgesetzt werden: alles aus Ebene 1 &amp; 2 <b>inklusive Anti-Teilchen</b>. Forschung, Relikte, Skills, Artefakte und Erfolge bleiben.`,()=>{
   const S=GS.S,gg=this.qkPending();if(gg<1)return;S.qk+=gg;S.qkLife+=gg;S.resets.l3++;S.at=0;S.atRunEarned=0;S.dm=0;S.dmRunEarned=0;this.resetRun(false,false);this.after(`Transzendenz: +${Fmt.n(gg)} Quanten-Kerne`);},{yesTxt:'Transzendieren',danger:true});},
 after(msg,silent){calcBonuses();Engine.droneAcc=0;Graph.data=[];UI.sigs={};UI.buildOrbit();Toast.show('✦ '+msg,'ach');if(!silent){AudioEngine.ach();Haptics.vib([30,40,60]);RenderEngine.flash();}SaveManager.save();UI.update();},
 autoTick(){const S=GS.S;if(S.auto.reset&&S.atLife>=25){const g=this.dmPending();if(g>=Math.max(1,S.dm))this.l1(true);}},
 skillInfo(id){const S=GS.S,sk=SKILL_BY_ID[id];if(!sk)return;const own=!!S.skills[id],reqOk=sk.req.every(r=>S.skills[r]);
  Modal.open(`<h3>${sk.i} ${sk.n}</h3><p class="mtext">${sk.d}</p><p class="mut">Kosten: ${sk.c} ⬢ Quanten-Kerne (verfügbar: ${Fmt.n(S.qk)})${sk.req.length?'<br>Voraussetzung: '+sk.req.map(r=>(S.skills[r]?'✔ ':'✘ ')+SKILL_BY_ID[r].n).join(', '):''}</p>${own?'<p><span class="badge">✔ Erlernt</span></p>':`<button class="btn full mt ${reqOk&&S.qk>=sk.c?'':'off'}" data-act="skillBuy" data-arg="${id}">Erlernen (${sk.c} ⬢)</button>`}<button class="btn full mt" data-act="modalClose">Schließen</button>`);},
 buySkill(id){const S=GS.S,sk=SKILL_BY_ID[id];if(!sk||S.skills[id])return;if(!sk.req.every(r=>S.skills[r])){UI.deny();Toast.show('Voraussetzungen fehlen','warn');return;}if(S.qk<sk.c){UI.deny();Toast.show('Nicht genug Quanten-Kerne','warn');return;}
  S.qk-=sk.c;S.skills[id]=true;calcBonuses();if(id==='swarm')UI.buildOrbit();AudioEngine.ach();RenderEngine.flash();Toast.show(`⬢ Skill erlernt: ${sk.n}`,'ach');Modal.close();UI.update();},
 relicCost(r){return Math.ceil(r.c*Math.pow(3,GS.S.relics[r.id]||0));},
 relicUp(id){const S=GS.S,r=RELIC_BY_ID[id];if(!r||!r.cond(S)){UI.deny();return;}const l=S.relics[id]||0;if(l>=25){UI.deny();return;}const c=this.relicCost(r);if(S.dm<c){UI.deny();Toast.show('Nicht genug Dunkle Materie','warn');return;}
  S.dm-=c;S.relics[id]=l+1;calcBonuses();AudioEngine.buy();Toast.show(`${r.i} ${r.n} → Stufe ${l+1}`);UI.update();}
};

/* ============================ MINIGAME ENGINE ============================ */
const Minigames={
 hack:{phase:'idle',seq:[],idx:0,round:0},
 tune:{phase:'idle',pos:0,dir:1,speed:.55,round:0,z0:.4,z1:.6},
 flashCell(i,ms,cls='lit'){const c=byId('hc'+i);if(!c)return;c.classList.add(cls);setTimeout(()=>c.classList.remove(cls),ms);},
 hackStart(){const S=GS.S;if(this.hack.phase!=='idle')return;if(now()<S.cd.hack){UI.deny();Toast.show('Kern-Hack lädt noch auf','warn');return;}this.hack={phase:'show',seq:[],idx:0,round:0};this.hackNext();UI.update();},
 hackNext(){const h=this.hack,len=4+h.round;h.seq=[];for(let i=0;i<len;i++)h.seq.push(randi(0,8));h.idx=0;h.phase='show';let i=0;
  const step=()=>{if(this.hack!==h||h.phase!=='show')return;if(i>=len){h.phase='input';UI.update();return;}this.flashCell(h.seq[i],360);AudioEngine.seq(h.seq[i]);i++;setTimeout(step,520);};setTimeout(step,600);},
 hackTap(c){const h=this.hack;if(h.phase!=='input')return;if(c!==h.seq[h.idx]){this.flashCell(c,400,'bad');this.hackEnd(false);return;}
  this.flashCell(c,160);AudioEngine.seq(c);Haptics.tap();h.idx++;
  if(h.idx>=h.seq.length){h.round++;if(h.round>=3)this.hackEnd(true);else{h.phase='show';Toast.show(`Runde ${h.round} geknackt!`);setTimeout(()=>{if(this.hack===h)this.hackNext();},500);}}UI.update();},
 hackEnd(win){const S=GS.S;this.hack={phase:'idle',seq:[],idx:0,round:0};
  if(win){S.hackUntil=now()+30000;S.cd.hack=now()+150000;S.st.hackWins++;Quests.track('mini',1);AudioEngine.ach();RenderEngine.flash();Haptics.vib([30,30,80]);Toast.show('💻 Kern gehackt! ×20 Multiplikator für 30 s','ach');}
  else{S.cd.hack=now()+60000;AudioEngine.err();Haptics.vib(120);Toast.show('Hack fehlgeschlagen – Firewall hat dich ausgesperrt (60 s)','warn');}UI.update();},
 tuneBtn(){if(this.tune.phase==='run')this.tuneTap();else this.tuneStart();},
 tuneStart(){const S=GS.S;if(now()<S.cd.tune){UI.deny();Toast.show('Frequenz-Tuner kühlt noch ab','warn');return;}this.tune={phase:'run',pos:0,dir:1,speed:.55,round:0,z0:.4,z1:.6};this.tuneZone();AudioEngine.ui();UI.update();},
 tuneZone(){const t=this.tune,w=[.22,.15,.09][t.round];t.z0=rand(.05,.95-w);t.z1=t.z0+w;t.speed=.55+t.round*.32;const z=byId('tZone');if(z){z.style.left=(t.z0*100)+'%';z.style.width=(w*100)+'%';}},
 tuneTap(){const t=this.tune;if(t.phase!=='run')return;if(t.pos>=t.z0&&t.pos<=t.z1){t.round++;AudioEngine.seq(t.round*3);Haptics.vib(15);if(t.round>=3)this.tuneEnd(true);else{this.tuneZone();Toast.show(`Resonanz ${t.round}/3 erreicht!`);}}else this.tuneEnd(false);UI.update();},
 tuneEnd(win){const S=GS.S;this.tune.phase='idle';
  if(win){const dm=Math.max(1,Math.floor(Prestige.dmPending()*.15+S.dm*.02));Rewards.give('dm',dm);S.cd.tune=now()+180000;S.st.tuneWins++;Quests.track('mini',1);calcBonuses();AudioEngine.ach();RenderEngine.flash();Toast.show(`📡 Perfekte Resonanz! +${Fmt.n(dm)} ◆ Dunkle Materie`,'ach');}
  else{S.cd.tune=now()+45000;AudioEngine.err();Haptics.vib(120);Toast.show('Frequenz verfehlt – Tuner überlastet (45 s)','warn');}UI.update();},
 tick(dt){const t=this.tune;if(t.phase!=='run')return;t.pos+=t.dir*t.speed*dt;if(t.pos>1){t.pos=1;t.dir=-1;}if(t.pos<0){t.pos=0;t.dir=1;}
  if(UI.tab==='mini'&&UI.sub.mini==='tune'){const bar=byId('tBar'),m=byId('tMark');if(bar&&m)m.style.transform=`translateX(${t.pos*bar.clientWidth}px)`;}}
};

/* ============================ UI CONTROLLER ============================ */
const UI={tab:'core',sub:{upg:'gen',pre:'resets',mini:'hack',set:'opt'},sigs:{},accOpen:{click:true},orbitN:-1,lastChips:'',
 sig(k,v){if(this.sigs[k]!==v){this.sigs[k]=v;return true;}return false;},
 deny(){AudioEngine.err();Haptics.vib(25);},
 init(){
  byId('hCurs').innerHTML=CURS.map(c=>`<span class="cur" id="cur-${c.k}" title="${c.n}">${c.i} <b></b></span>`).join('');
  byId('bossCard').innerHTML=`<div class="row"><div class="grow"><b id="bossInfo">Boss-Radar</b><div class="mut" id="bossSub"></div></div><button class="btn mag hidden" id="bossBtn" data-act="boss">Angreifen</button></div>`;
  byId('warpRow').innerHTML=[1,8,24].map(h=>`<button class="btn" id="w${h}" data-act="warp" data-arg="${h}"></button>`).join('');
  this.buildHack();this.buildTune();this.buildMarket();this.buildSave();
  document.addEventListener('click',e=>{
   const sb=e.target.closest('.seg button');if(sb){AudioEngine.init();AudioEngine.ui();this.setSub(sb.parentNode.dataset.seg,sb.dataset.sub);return;}
   const b=e.target.closest('[data-act]');if(!b)return;AudioEngine.init();const f=Actions[b.dataset.act];if(f)f(b.dataset.arg,b,e);
  });
  document.addEventListener('change',e=>this.onSetting(e));
  document.addEventListener('input',e=>{if(e.target.type==='range')this.onSetting(e);});
  const cw=byId('coreWrap');
  cw.addEventListener('pointerdown',e=>{e.preventDefault();AudioEngine.init();if(Engine.pointers.size===0)Engine.holdStart=now();Engine.pointers.add(e.pointerId);Engine.tap(e.clientX,e.clientY);},{passive:false});
  const up=e=>Engine.pointers.delete(e.pointerId);
  window.addEventListener('pointerup',up,{passive:true});window.addEventListener('pointercancel',up,{passive:true});
  window.addEventListener('blur',()=>Engine.pointers.clear());
  byId('bossTap').addEventListener('pointerdown',e=>{e.preventDefault();AudioEngine.init();Boss.tap(e.clientX,e.clientY);},{passive:false});
  byId('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!Modal.lock)Modal.close();});
  window.addEventListener('resize',()=>{if(this.tab==='core')Graph.draw();});
  this.buildOrbit();this.switchTab('core');
 },
 switchTab(t){this.tab=t;$$('.tab').forEach(s=>s.classList.toggle('active',s.id==='t-'+t));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.arg===t));byId('main').scrollTop=0;AudioEngine.ui();this.update();this.slow();if(t==='core')setTimeout(()=>Graph.draw(),40);},
 setSub(seg,sub){const s=$(`.seg[data-seg="${seg}"]`);if(!s)return;this.sub[seg]=sub;$$('button',s).forEach(b=>b.classList.toggle('on',b.dataset.sub===sub));const tab=s.closest('.tab');$$('.sub',tab).forEach(x=>x.classList.toggle('on',x.dataset.subid===sub));this.update();this.slow();},
 buildOrbit(){const n=Math.min(GS.S.drones,18);if(n===this.orbitN)return;this.orbitN=n;let h='';for(let i=0;i<n;i++)h+=`<div class="dslot" style="transform:rotate(${(360/n*i).toFixed(1)}deg)"><div class="drone"></div></div>`;byId('orbit').innerHTML=h;},

 /* ---------- globale Updates (4×/s) ---------- */
 update(){
  const S=GS.S,t=now();
  this.header();
  document.body.classList.toggle('hyper',t<S.odUntil);
  document.body.classList.toggle('shut',t<S.shutUntil);
  switch(this.tab){
   case'core':this.updCore();break;
   case'upg':if(this.sub.upg==='gen')this.updGen();else if(this.sub.upg==='impr')this.updImpr();else this.updDrone();break;
   case'res':this.updRes();break;
   case'art':this.updArts();break;
   case'pre':if(this.sub.pre==='resets')this.updResets();else if(this.sub.pre==='tree')this.renderTree();else this.updRelics();break;
   case'mini':if(this.sub.mini==='hack')this.updHack();else if(this.sub.mini==='tune')this.updTune();else if(this.sub.mini==='market')this.updMarket();else this.updMissions();break;
   case'set':if(this.sub.set==='opt')this.renderOpt();else if(this.sub.set==='ach')this.renderAch();break;
  }
 },
 slow(){
  const S=GS.S,ds=Daily.state();
  const qOk=S.quests.list.some(q=>!q.c&&q.p>=q.t);
  const wOk=S.weekly.goals.some((g,i)=>!S.weekly.claimed[i]&&g.p>=g.t)||(!S.weekly.final&&S.weekly.claimed.length===3&&S.weekly.claimed.every(x=>x));
  tog('missionDot','on',!ds.claimed||qOk||wOk);
  if(this.tab==='set'){if(this.sub.set==='stats')this.renderStats();if(this.sub.set==='save')setTxt('lastSaveTxt',new Date(S.lastSave).toLocaleTimeString('de-DE'));}
 },
 header(){
  const S=GS.S;setTxt('hEnergy',Fmt.n(S.energy));setTxt('hDps',Fmt.n(Engine.totalDps()));
  setTxt('hSoft',Engine.softLvl?` ⚠ Softcap ${['','I','II','III','MAX'][Engine.softLvl]} · ${Fmt.pct(Engine.capRatio)} Effizienz`:'');
  for(const c of CURS){const el=byId('cur-'+c.k);if(!el)continue;const show=c.life?S[c.life]>0:true;el.classList.toggle('hidden',!show);if(show){const b=el.lastChild,v=Fmt.n(S[c.k]);if(b.textContent!==v)b.textContent=v;}}
 },

 /* ---------- KERN ---------- */
 updCore(){
  const S=GS.S,t=now(),B=Engine.B;
  setTxt('comboTxt','×'+Fmt.dec(S.combo));setW('comboBar',(S.combo-1)/Math.max(.01,B.comboMax-1)*100);
  const hy=t<S.odUntil;
  setTxt('odTxt',hy?'AKTIV · '+Math.ceil((S.odUntil-t)/1000)+' s':Math.floor(S.odMeter)+'%');
  setW('odBar',hy?(S.odUntil-t)/(B.odDur*1000)*100:S.odMeter);
  const hb=byId('hyperBtn'),rdy=S.odMeter>=100&&!hy;hb.classList.toggle('off',!rdy);hb.classList.toggle('ready',rdy);setTxt('hyperBtn',hy?'⚡ HYPER-MODUS AKTIV ⚡':'HYPER-MODUS AKTIVIEREN');
  const sh=t<S.shutUntil;
  setTxt('heatTxt',sh?'ÜBERHITZT · '+Math.ceil((S.shutUntil-t)/1000)+' s':Math.floor(S.heat)+'% · ×'+Fmt.dec(1+(B.overloadMax-1)*S.heat/100));
  setW('heatBar',S.heat);setTxt('coreTxt',sh?'ÜBERHITZT':'');
  const ev=Events.cur(),eb=byId('evBanner');
  if(ev){eb.classList.remove('hidden');eb.classList.toggle('neg',!ev.pos);const h=`<span class="ei">${ev.i}</span><div><b>${ev.n}</b>${ev.d}</div><span class="bt">${Math.ceil((S.ev.until-t)/1000)} s</span>`;if(eb.innerHTML!==h)eb.innerHTML=h;}else eb.classList.add('hidden');
  const ch=[];if(hy)ch.push(`<span class="chip hot">⚡ Hyper ×10 · ${Math.ceil((S.odUntil-t)/1000)} s</span>`);
  if(t<S.hackUntil)ch.push(`<span class="chip hot">💻 Kern-Hack ×20 · ${Math.ceil((S.hackUntil-t)/1000)} s</span>`);
  if(t<S.returnUntil)ch.push(`<span class="chip">↺ Rückkehr ×2 · ${Fmt.t((S.returnUntil-t)/1000)}</span>`);
  if(S.heat>1&&!sh)ch.push(`<span class="chip">🔥 Überladung ×${Fmt.dec(1+(B.overloadMax-1)*S.heat/100)}</span>`);
  ch.push(`<span class="chip">☝ ${Fmt.n(Engine.clickBase*Engine.tempClick())}/Klick · Krit ${Fmt.pct(B.critChance)} ×${Fmt.dec(B.critMult,1)}</span>`);
  const chs=ch.join('');if(chs!==this.lastChips){this.lastChips=chs;byId('boostChips').innerHTML=chs;}
  const b=S.boss;tog('bossCard','alert',b.ready);tog('bossBtn','hidden',!b.ready);
  if(b.ready){setTxt('bossInfo',`⚠ ${b.name} · Stufe ${b.lvl}`);setTxt('bossSub',`Flieht in ${Math.max(0,Math.ceil((b.expire-t)/1000))} s – zerstöre seinen Schild!`);}
  else{setTxt('bossInfo',`Boss-Radar · nächste Stufe ${b.lvl}`);setTxt('bossSub',`Nächster Kontakt in ${Fmt.t(Math.max(0,(b.next-t)/1000))}`);}
  for(const h of[1,8,24]){const n=S.warps['h'+h]||0,el=byId('w'+h),html=`${h} h<br><small>×${n}</small>`;if(el.innerHTML!==html)el.innerHTML=html;el.classList.toggle('off',n<1);}
 },

 /* ---------- GENERATOREN ---------- */
 updGen(){
  const S=GS.S;let vis=1;for(let i=1;i<15;i++)if(Shop.unlocked(i))vis=i+1;
  const ab=S.atLife>=1;
  if(this.sig('buyrow',S.set.buyAmt+'|'+ab+'|'+S.auto.buyer)){
   byId('buyRow').innerHTML=`<span class="mut">Kaufmenge:</span>${[1,10,25,'max'].map(a=>`<button class="btn sm ${S.set.buyAmt===a?'on':''}" data-act="buyAmt" data-arg="${a}">${a==='max'?'Max':'×'+a}</button>`).join('')}${ab?`<label class="tog">Auto-Käufer <span class="sw"><input type="checkbox" data-auto="buyer" ${S.auto.buyer?'checked':''}><span></span></span></label>`:''}`;
  }
  if(this.sig('gen',vis)){
   let h='';for(let i=0;i<vis;i++){const b=BUILDINGS[i];h+=`<div class="bcard" id="bcard-${i}"><div class="bico">${b.i}</div><div class="binfo"><div class="bname">${b.n}<span id="bn-${i}"></span></div><div class="bsub" id="bp-${i}"></div><div class="bms"><div class="bar thin"><i id="bm-${i}"></i></div><small id="bmt-${i}"></small></div><div class="bsyn" id="bs-${i}"></div></div><button class="btn bbuy" data-act="buyB" data-arg="${i}" id="bb-${i}"><span id="ba-${i}"></span><b id="bc-${i}"></b></button></div>`;}
   if(vis<15)h+=`<div class="bcard locked"><div class="bico">?</div><div class="binfo"><div class="bname">??? Unbekannte Technologie</div><div class="bsub">Kaufe zuerst 1× ${BUILDINGS[vis-1].n}</div></div></div>`;
   byId('genList').innerHTML=h;
  }
  const tot=Engine.raw||1;
  for(let i=0;i<vis;i++){
   const n=S.b[i],amt=Shop.amount(i),c=Shop.costN(i,amt),can=S.energy>=c;
   setTxt('bn-'+i,Fmt.int(n));
   const p=Engine.perB[i]*Engine.capRatio;setTxt('bp-'+i,n?`${Fmt.n(p)}/s · ${Fmt.pct(Engine.perB[i]/tot)} Anteil · ${Fmt.n(p/n)}/s je Einheit`:`Basis: ${Fmt.n(BUILDINGS[i].p*Engine.B.prodMult)}/s je Einheit`);
   const nm=MILESTONES.find(m=>m>n),pm=[0,...MILESTONES].filter(m=>m<=n).pop();
   if(nm){setW('bm-'+i,(n-pm)/(nm-pm)*100);setTxt('bmt-'+i,`Meilenstein ${nm} (×${Fmt.dec(Engine.B.milestone,2).replace(/,00$/,'')})`);}else{setW('bm-'+i,100);setTxt('bmt-'+i,'Alle Meilensteine ✔');}
   const sy=Engine.synergy(i);setTxt('bs-'+i,sy>1?`⟷ Synergie von ${BUILDINGS[i===0?14:i-1].n}: +${Fmt.pct(sy-1)}`:'');
   setTxt('ba-'+i,S.set.buyAmt==='max'?'Max ×'+amt:'×'+amt);setTxt('bc-'+i,Fmt.n(c));
   tog('bb-'+i,'off',!can);tog('bcard-'+i,'can',can);
  }
 },
 updImpr(){
  const S=GS.S;const list=UPGRADES.filter(u=>!S.upg[u.id]&&S.b[u.bi]>=Math.ceil(u.req/2)).sort((a,b)=>a.c-b.c);
  const owned=UPGRADES.filter(u=>S.upg[u.id]).length;
  if(this.sig('impr',list.map(u=>u.id).join(',')+'|'+owned)){

  for(const k in MKT){const it=MKT[k];h+=`<div class="mk"><div class="mk-h"><div><b>${it.i} ${it.n}</b><div class="mut">Besitz: <b id="mo-${k}"></b></div></div><div style="text-align:right"><b id="mp-${k}"></b><div class="mut" id="mc-${k}"></div></div></div><svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline id="ms-${k}" fill="none" style="stroke:var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" points="0,15 100,15"/></svg><div class="btns"><button class="btn sm" data-act="mBuy" data-arg="${k}:1" id="mb1-${k}">+1</button><button class="btn sm" data-act="mBuy" data-arg="${k}:10" id="mb10-${k}">+10</button><button class="btn sm" data-act="mBuy" data-arg="${k}:100" id="mb100-${k}">+100</button><button class="btn sm mag" data-act="mSell" data-arg="${k}:10">−10</button><button class="btn sm mag" data-act="mSell" data-arg="${k}:all">Alle</button></div></div>`;}
  h+=`<div class="card"><h3>Schwarzmarkt-Händler <small>gegen ₵ Krypto-Credits</small></h3>${Object.keys(SHOP).map(id=>`<div class="item"><div class="grow"><div class="t">${SHOP[id].n}</div><div class="d">${SHOP[id].d}</div></div><button class="btn sm" id="sh-${id}" data-act="shop" data-arg="${id}">${Fmt.int(SHOP[id].c)} ₵</button></div>`).join('')}</div>`;
  byId('marketBox').innerHTML=h;},
 updMarket(){const S=GS.S,m=S.market;setTxt('mkSell',Fmt.pct(Engine.B.sellRatio));
  for(const k in MKT){const p=Market.price(k);setTxt('mp-'+k,Fmt.n(p)+' E');setTxt('mo-'+k,Fmt.n(S[k]));const hh=m.h[k],a=hh[hh.length-1],b=hh.length>1?hh[hh.length-2]:a,ch=(a/b-1);
   const mc=byId('mc-'+k);if(mc){const tx=(ch>=0?'▲ ':'▼ ')+Fmt.pct(Math.abs(ch))+' · Index '+Fmt.dec(a);if(mc.textContent!==tx){mc.textContent=tx;mc.className='mut '+(ch>=0?'up':'down');}}
   const pl=byId('ms-'+k);if(pl&&pl._n!==hh.length+':'+a){pl._n=hh.length+':'+a;const lo=Math.log(.4),hi=Math.log(2.5);pl.setAttribute('points',hh.map((v,i)=>`${(hh.length>1?i/(hh.length-1)*100:50).toFixed(1)},${(29-(Math.log(v)-lo)/(hi-lo)*28).toFixed(1)}`).join(' '));}

 updMissions(){

  setTxt('qReset','neu in '+Fmt.t(secToMidnight()));

 },

  const th=[['cyan','#00F3FF','Neon-Cyan'],['magenta','#FF007F','Cyber-Magenta'],['emerald','#00FF66','Smaragd-Grün'],['gold','#FFC23D','Solar-Gold']];
  byId('optBox').innerHTML=`<div class="card"><h3>Darstellung</h3><div class="mut">Zahlenformat</div><div class="btns mt">${[['std','Standard'],['sci','Wissenschaftlich'],['eng','Ingenieur']].map(([k,n])=>`<button class="btn sm ${s.fmt===k?'on':''}" data-act="fmt" data-arg="${k}">${n}</button>`).join('')}</div><p class="mut mt">Beispiel: ${Fmt.n(1234567890123)} · ${Fmt.n(9.87e45)}</p>
   <div class="set-row"><span>Neon-Thema<br><small class="mut">${th.find(x=>x[0]===s.theme)[2]}</small></span><div class="row">${th.map(([k,c,n])=>`<button class="sw-col ${s.theme===k?'on':''}" style="background:${c}" data-act="theme" data-arg="${k}" aria-label="${n}"></button>`).join('')}</div></div>
   <div class="mut mt">Kern-Aura (${S.auras.length}/${AURAS.length} freigeschaltet über Wochen-Herausforderungen)</div><div class="btns mt">${AURAS.filter(a=>S.auras.includes(a.id)).map(a=>`<button class="btn sm ${s.aura===a.id?'on':''}" data-act="aura" data-arg="${a.id}">${a.n}</button>`).join('')}</div></div>
   <div class="card"><h3>Leistung &amp; Effekte</h3>${sw('battery','Energiesparmodus (30 FPS, keine Partikel)')}${rg('shake','Bildschirmwackeln')}${rg('particles','Partikel-Intensität')}</div>

 onSetting(e){const t=e.target;if(t.dataset.set){const k=t.dataset.set;GS.S.set[k]=t.type==='checkbox'?t.checked:+t.value;const rv=byId('rv-'+k);if(rv)rv.textContent=t.value+'%';Settings.apply();this.sigs.opt=JSON.stringify(GS.S.set)+GS.S.auras.join(',');if(e.type==='change')AudioEngine.ui();}
  else if(t.dataset.auto){GS.S.auto[t.dataset.auto]=t.checked;AudioEngine.ui();Toast.show(t.checked?'Automatik aktiviert':'Automatik deaktiviert');}},
 renderStats(){const S=GS.S,B=Engine.B;const rows=[['Gesamte Klicks',Fmt.int(S.st.clicks)],['Kritische Treffer',Fmt.int(S.st.crits)],['Energie (Lebenszeit)',Fmt.n(S.lifeEnergy)],['Energie (aktueller Lauf)',Fmt.n(S.runEnergy)],['Aktuelle Rate',Fmt.n(Engine.totalDps())+'/s'],['Höchste gemessene Rate',Fmt.n(S.st.peakDps)+'/s'],['Spielzeit',Fmt.t(S.st.playtime)],['Quanten-Resets',S.resets.l1],['Dimensions-Kollapse',S.resets.l2],['Transzendenzen',S.resets.l3],['Besiegte Bosse',S.st.bosses],['Aktuelle Boss-Stufe',S.boss.lvl],['Kern-Hacks gewonnen',S.st.hackWins],['Frequenz-Siege',S.st.tuneWins],['Gefundene Artefakte',S.st.drops],['Zerlegte Artefakte',S.st.scrapped],['Hyper-Modi aktiviert',S.st.hypers],['Überhitzungen',S.st.overheats],['Höchste Combo','×'+Fmt.dec(S.st.maxCombo)],['Längste Login-Serie',S.st.bestStreak+' Tage'],['Erfolge',`${Object.keys(S.ach).length} / ${ACH.length}`],['Globaler Produktions-Multiplikator','×'+Fmt.n(B.prodMult)],['Klickkraft (Basis)',Fmt.n(Engine.clickBase)],['Krit-Chance / Multiplikator',`${Fmt.pct(B.critChance)} / ×${Fmt.dec(B.critMult,1)}`],['Softcap-Stufe',Engine.softLvl?`${['','I','II','III','MAX'][Engine.softLvl]} (${Fmt.pct(Engine.capRatio)})`:'keine'],['Offline: Effizienz / Limit',`${Fmt.pct(B.offlineEff)} / ${B.offlineCap} h`],['Bildrate',Engine.fps+' FPS'],['Anti-Cheat-Verstöße',S.cheat]];

 renderAch(){const S=GS.S,n=Object.keys(S.ach).length;if(!this.sig('ach',n+'|'+S.set.fmt))return;const cats=[...new Set(ACH.map(a=>a.cat))];

  byId('achBox').innerHTML=h;},
 buildSave(){byId('saveBox').innerHTML=`<div class="card"><h3>Automatisches Speichern</h3><p class="mut">Dein Spielstand wird alle 5 Sekunden lokal gesichert (sowie beim Verlassen der App). Letzte Sicherung: <b id="lastSaveTxt">–</b></p><button class="btn full mt" data-act="saveNow">Jetzt speichern</button></div>
  <div class="card"><h3>Export</h3><p class="mut">Verschlüsselter Base64-Code mit Prüfsumme – zum Übertragen auf andere Geräte.</p><textarea id="expTxt" readonly placeholder="Tippe auf „Code erzeugen“"></textarea><div class="grid2 mt"><button class="btn" data-act="exportSave">Code erzeugen</button><button class="btn" data-act="copyExport">Kopieren</button></div></div>
  <div class="card"><h3>Import</h3><textarea id="impTxt" placeholder="Export-Code hier einfügen …"></textarea><button class="btn full mt" data-act="importSave">Spielstand laden</button></div>
  <div class="card"><h3>Gefahrenzone</h3><p class="mut">Löscht deinen gesamten Fortschritt unwiderruflich.</p><button class="btn mag full mt" data-act="wipe">Spielstand vollständig löschen</button></div>`;}

/* ============================ SETTINGS ============================ */
const Settings={apply(){const s=GS.S.set;document.body.dataset.theme=s.theme;document.body.dataset.aura=s.aura;document.body.classList.toggle('lowfx',!!s.battery);AudioEngine.setVol();
 const c=getComputedStyle(document.body).getPropertyValue('--accent').trim();Graph.color=c||'#00F3FF';if(UI.tab==='core')Graph.draw();}};

/* ============================ ACTIONS ============================ */
const Actions={
 tab:a=>UI.switchTab(a),
 missions:()=>{UI.switchTab('mini');UI.setSub('mini','missions');},
 buyAmt:a=>{GS.S.set.buyAmt=a==='max'?'max':+a;AudioEngine.ui();UI.update();},
 buyB:a=>Shop.buyBuilding(+a),buyUpg:a=>Shop.buyUpgrade(a),buyDrone:()=>Shop.buyDrone(),research:a=>Shop.research(a),
 acc:a=>{UI.accOpen[a]=!UI.accOpen[a];const el=byId('resBox').querySelector(`[data-arg="${a}"]`);if(el)el.parentNode.classList.toggle('open',!!UI.accOpen[a]);UI.sigs.res=UI.sigs.res&&UI.sigs.res.split('|')[0]+'|'+Object.keys(UI.accOpen).filter(k=>UI.accOpen[k]).join(',');AudioEngine.ui();},
 hyper:()=>Engine.activateHyper(),warp:a=>TimeWarp.use(+a),boss:()=>Boss.engage(),
 artOpen:a=>{AudioEngine.ui();UI.openArt(+a);},
 artEquip:a=>{Arts.equip(+a);delete UI.sigs.arts;UI.openArt(+a);UI.update();},
 artUnequip:a=>{Arts.unequip(+a);delete UI.sigs.arts;UI.openArt(+a);UI.update();},
 artUp:a=>{Arts.upgrade(+a);delete UI.sigs.arts;UI.openArt(+a);UI.update();},
 artScrap:a=>{if(Arts.scrap(+a)){Modal.close();delete UI.sigs.arts;UI.update();}},
 artLock:a=>{Arts.toggleLock(+a);delete UI.sigs.arts;UI.openArt(+a);UI.update();},
 scrapCommon:()=>{Arts.scrapCommon();UI.update();},
 artSort:a=>{GS.S.artSort=a;AudioEngine.ui();UI.update();},
 l1:()=>Prestige.l1(false),l2:()=>Prestige.l2(),l3:()=>Prestige.l3(),
 skill:a=>{AudioEngine.ui();Prestige.skillInfo(a);},skillBuy:a=>Prestige.buySkill(a),relicUp:a=>Prestige.relicUp(a),
 hackStart:()=>Minigames.hackStart(),hackCell:a=>Minigames.hackTap(+a),
 mBuy:a=>{const[k,n]=a.split(':');Market.buy(k,+n);UI.update();},mSell:a=>{const[k,n]=a.split(':');Market.sell(k,n==='all'?Infinity:+n);UI.update();},shop:a=>{Market.shop(a);UI.update();},
 dailyClaim:()=>Daily.claim(),questClaim:a=>Quests.claim(+a),weeklyClaim:a=>Weekly.claim(+a),weeklyFinal:()=>Weekly.final(),
 fmt:a=>{GS.S.set.fmt=a;Settings.apply();UI.sigs={};AudioEngine.ui();UI.update();},

 saveNow:()=>{SaveManager.save();Toast.show('💾 Spielstand gespeichert');AudioEngine.buy();UI.slow();},
 exportSave:()=>{try{byId('expTxt').value=SaveManager.exportStr();Toast.show('Export-Code erzeugt');AudioEngine.ui();}catch(e){Toast.show('Export fehlgeschlagen: '+e.message,'warn');}},
 copyExport:()=>{const ta=byId('expTxt');if(!ta.value)ta.value=SaveManager.exportStr();const done=()=>Toast.show('📋 Code in die Zwischenablage kopiert');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.select();try{document.execCommand('copy');done();}catch(e){Toast.show('Bitte manuell kopieren','warn');}});
  else{ta.select();try{document.execCommand('copy');done();}catch(e){Toast.show('Bitte manuell kopieren','warn');}}},
 importSave:()=>{const v=byId('impTxt').value;let o;try{o=SaveManager.importStr(v);}catch(e){UI.deny();Platform.alert('Import fehlgeschlagen',e.message);return;}
  Modal.confirm('Spielstand importieren?','Dein aktueller Fortschritt wird durch den importierten Spielstand <b>ersetzt</b>.',()=>{SaveManager.blocked=true;try{localStorage.setItem(SaveManager.KEY,JSON.stringify(o));}catch(e){}location.reload();},{yesTxt:'Importieren',danger:true});},
 wipe:()=>Modal.confirm('Alles löschen?','Dein gesamter Fortschritt – inklusive Prestige, Forschung und Artefakten – wird <b>unwiderruflich</b> gelöscht.',()=>setTimeout(()=>Modal.confirm('Wirklich sicher?','Letzte Warnung. Dies kann nicht rückgängig gemacht werden.',()=>{SaveManager.blocked=true;try{localStorage.removeItem(SaveManager.KEY);}catch(e){}location.reload();},{yesTxt:'Endgültig löschen',danger:true}),250),{yesTxt:'Weiter',danger:true}),
 modalClose:()=>Modal.close(),
 modalYes:()=>{const f=Modal._yes;Modal._yes=null;Modal.close();if(f)f();}
};

/* ============================ PLATTFORM (Cordova / Capacitor / PWA) ============================ */
const Platform={
 init(){
  const back=e=>{if(e&&e.preventDefault)e.preventDefault();if(!this.handleBack())this.exitPrompt();};
  document.addEventListener('deviceready',()=>{
   document.addEventListener('backbutton',back,false);
   document.addEventListener('pause',()=>{SaveManager.save();Engine.hiddenAt=now();},false);
   document.addEventListener('resume',()=>this.resume(),false);
  },false);
  try{const C=window.Capacitor;if(C&&C.Plugins&&C.Plugins.App){C.Plugins.App.addListener('backButton',()=>back());C.Plugins.App.addListener('appStateChange',s=>{if(!s.isActive)SaveManager.save();});}}catch(e){}
  try{history.replaceState({qi:0},'');history.pushState({qi:1},'');window.addEventListener('popstate',()=>{if(this.handleBack())history.pushState({qi:1},'');});}catch(e){}
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){Engine.hiddenAt=now();Engine.pointers.clear();SaveManager.save();}else this.resume();});
  window.addEventListener('pagehide',()=>SaveManager.save());
  window.addEventListener('beforeunload',()=>SaveManager.save());
 },
 resume(){const t=now();if(Engine.hiddenAt){const sec=(t-Engine.hiddenAt)/1000;Engine.hiddenAt=0;
   if(t<GS.S.maxSeen-120000){GS.S.cheat++;Toast.show('⚠ Anti-Cheat: Zeitmanipulation erkannt – kein Offline-Ertrag.','warn');}
   else if(sec>5)Offline.apply(sec,sec>=60);
   GS.S.maxSeen=Math.max(GS.S.maxSeen,t);}
  Engine.last=performance.now();},
 handleBack(){if(Boss.active)return true;if(Modal.isOpen()){Modal.close();return true;}if(UI.tab!=='core'){UI.switchTab('core');return true;}return false;},
 exitPrompt(){Modal.confirm('Spiel verlassen?','Dein Fortschritt wird automatisch gespeichert.',()=>{SaveManager.save();try{if(navigator.app&&navigator.app.exitApp)navigator.app.exitApp();else if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App)Capacitor.Plugins.App.exitApp();}catch(e){}},{yesTxt:'Beenden'});},
 alert(title,msg){if(navigator.notification&&navigator.notification.alert)navigator.notification.alert(msg,()=>{},title,'OK');else Modal.alert(title,msg);}
};

/* ============================ BOOT ============================ */
function boot(){
 GS.init();buildAch();RenderEngine.init();calcBonuses();Quests.ensure();Weekly.ensure();Settings.apply();UI.init();Platform.init();
 const S=GS.S,t=now();
 if(GS.loaded){
  if(t<S.maxSeen-120000){S.cheat++;Toast.show('⚠ Anti-Cheat: Die Systemzeit liegt vor deinem letzten Spielstand. Offline-Ertrag deaktiviert.','warn');}
  else{const sec=(t-S.lastSave)/1000;if(sec>30)Offline.apply(sec,true);}
 }else{
  Modal.open(`<h3>Willkommen im Quanten-Imperium</h3><div class="mtext"><p>Kommandant, dein Quantenkern ist online.</p><p>☝ <b>Tippe</b> auf den Kern für Energie – schnelles Tippen baut Combos und Hyper-Ladung auf.<br>🔥 <b>Halte</b> ihn gedrückt für Überladung, aber achte auf die Hitze.<br>⇪ Baue <b>Generatoren</b> für passives Einkommen.<br>⚗ Handle <b>Forschungsdaten</b> im Darknet und erforsche neue Technologien.<br>✦ Steige über <b>drei Prestige-Ebenen</b> zur Singularität auf.</p></div><button class="btn full mt" data-act="modalClose">Imperium starten</button>`);
 }
 S.maxSeen=Math.max(S.maxSeen,t);calcBonuses();
 Engine.start();
 setTimeout(()=>{if(!Daily.state().claimed)Toast.show('🎁 Tägliche Belohnung verfügbar! (Minispiele → Missionen)');},1800);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
